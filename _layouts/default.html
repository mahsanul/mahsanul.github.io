<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body class="{{ page.body_class }}">
  <a class="skip-link" href="#main">Skip to main content</a>
  {% include header.html %}

  <main id="main" tabindex="-1">
    {{ content }}
  </main>

  {% include footer.html %}
  {% include icons.html %}

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  {% if page.drift %}<script src="{{ '/assets/js/drift.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
