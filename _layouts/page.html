---
layout: default
---
<article class="page">
  <header class="page-head">
    <div class="wrap">
      <p class="kicker"><a href="{{ '/' | relative_url }}">Home</a><span aria-hidden="true"> / </span><span>{{ page.kicker | default: page.title }}</span></p>
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
    </div>
  </header>
  <div class="wrap page-body">
    {{ content }}
  </div>
</article>
