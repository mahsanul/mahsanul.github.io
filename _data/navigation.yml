# ---------------------------------------------------------------------------
# MENU: the links at the top of every page, in order.
#
#   title     Text in the menu.
#   url       Page address. It must start and end with a slash, like /research/
#   requires  Optional. "talks" = show only when talks.yml has items.
#             "posts" = show only when at least one Note exists in _posts.
#
# To hide a tab, put a # at the start of its lines.
# To change the order, move the blocks up or down.
# ---------------------------------------------------------------------------

- title: "Research"
  url: /research/

- title: "Publications"
  url: /publications/

- title: "Teaching"
  url: /teaching/

- title: "Projects"
  url: /projects/

- title: "Talks"
  url: /talks/
  requires: talks

- title: "Notes"
  url: /notes/
  requires: posts

- title: "CV"
  url: /cv/
