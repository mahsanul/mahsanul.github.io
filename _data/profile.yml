# "About" section on the home page. You can use Markdown (**bold**, *italic*, [link](url)).
bio: |
  I am a Ph.D. student in Computer Science at the University of Texas at El Paso (UTEP). I work at the intersection of artificial intelligence and cybersecurity. My research builds machine learning systems for malware detection that are robust, scalable, and able to adapt as the world changes.

  Many real-world problems are hard because of **concept drift**. This means the data changes over time, so a model that worked well yesterday may fail today. I study this problem in malware detection. I am especially interested in **continual learning**, **semi-supervised learning**, and **foundation models** that can adapt to new and unseen threats with very few labeled examples.

  Before my Ph.D., I worked for five years as a Lecturer in Computer Science. I taught Artificial Intelligence, Data Structures, Algorithms, and Operating Systems. This work gave me a strong base in both theory and practice, and a real interest in teaching and mentoring.

  My long-term goal is to connect research with real use. I want to build intelligent systems that work reliably in large, real-world environments. Outside research, I enjoy learning new technologies and working on open-source projects.

