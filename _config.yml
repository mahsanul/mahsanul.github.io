# ---------------------------------------------------------------------------
# Site settings for Md Ahsanul Haque's academic website.
#
# You will rarely need to edit this file. Almost all content (bio, news,
# publications, CV items, links) is in the _data/ folder.
# See WEBSITE_GUIDE.md for step-by-step instructions.
#
# NOTE: When you change this file, GitHub rebuilds the whole site.
#       If you preview locally, restart the preview after you change it.
# ---------------------------------------------------------------------------

title: "Md Ahsanul Haque"
description: "Personal website of Md Ahsanul Haque, a Computer Science PhD student at UTEP working on adversarial machine learning, malware detection, and model robustness under distribution drift."
lang: en-US
url: "https://mahsanul.github.io"   # Do not add a slash at the end
baseurl: ""                         # Keep empty for a user site (username.github.io)
repository: "mahsanul/mahsanul.github.io"
timezone: America/Denver            # El Paso uses Mountain Time

# Notes (blog posts) are written in the _posts folder.
permalink: /notes/:title/

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  auto_ids: true

# Plugins that GitHub Pages supports
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# Folders that Jekyll should read (folders that start with "_" are skipped unless listed here)
include:
  - _pages

# Files that should NOT be published on the website
exclude:
  - WEBSITE_GUIDE.md
  - README.md
  - LICENSE
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules

# Default layouts, so that page files stay short
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: note
